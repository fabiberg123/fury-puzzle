<title>Fury Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen game — HUD on top, canvas stage (fury bar + board + tray), tool row, ad banner strip.
   Each skin is its own single visual world; JS writes these tokens per skin. */
:root{
  --bg:#120504; --fg:#fff3e6; --muted:rgba(255,236,220,.62); --accent:#ff6a1a; --accent2:#ffc233;
  --panel:rgba(30,10,7,.86); --edge:rgba(255,120,60,.28); --btnfg:#1a0703;
  --display:"Bungee","Impact","Arial Black",system-ui,sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:#0d0403;overscroll-behavior:none}
body{font-family:var(--body);color:var(--fg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);transition:background .4s}
button{font-family:var(--body)}
.hud{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;padding:8px 16px 0}
.icon{position:relative;width:44px;height:44px;border-radius:14px;border:1px solid var(--edge);background:var(--panel);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.icon svg{width:22px;height:22px}
.icon:focus-visible,.btn:focus-visible,.skin:focus-visible,.tool:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.scorebox{text-align:center;line-height:1}
.toprow{display:flex;justify-content:center;gap:14px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.best{display:inline-flex;align-items:center;gap:5px;color:var(--accent2)}
.best svg{width:17px;height:17px}
.coins{display:inline-flex;align-items:center;gap:5px;color:var(--fg)}
svg.coin{width:17px;height:17px;flex:none}
.score{font-family:var(--display);font-size:clamp(32px,9vw,46px);margin-top:3px;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.score.bump{animation:bump .25s ease-out}
@keyframes bump{40%{transform:scale(1.12)}}
.tobest{height:16px;font-size:13px;font-weight:700;color:var(--muted);margin-top:2px}
.tobest.rec{color:var(--accent2);font-family:var(--display);font-weight:400}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.tools{display:flex;justify-content:center;gap:14px;padding:4px 16px 6px;flex:none}
.tool{position:relative;width:62px;height:50px;border-radius:16px;border:1px solid var(--edge);background:var(--panel);color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0}
.tool svg{width:26px;height:26px}
.tool .cnt{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--accent2);color:var(--btnfg);font-family:var(--display);font-size:12px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.tool .cnt.zero{background:#5d9cff;color:#fff}
.tool.on{background:var(--accent2);color:var(--btnfg);animation:wob .6s infinite}
@keyframes wob{50%{transform:rotate(-6deg) scale(1.05)}}
.tool:disabled{opacity:.4}
.banner{height:56px;flex:none;display:grid;place-items:center;margin:0 16px 6px;border-radius:10px;border:1px dashed var(--edge);color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.banner.native{border:0;margin:0}
.dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#ff3355;border:2px solid var(--panel)}

#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:4;max-width:calc(100% - 32px);padding:8px 16px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);font-weight:800;font-size:15px;text-align:center;pointer-events:none;transition:opacity .25s,transform .25s}
#toast[hidden]{display:block!important;opacity:0;transform:translate(-50%,10px)}
#stuck{position:absolute;left:16px;right:16px;bottom:10px;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--accent);animation:pop .3s}
#stuck p{margin:0;flex:1;font-weight:800;font-size:15px;line-height:1.2}
#stuck .btn{font-size:14px;padding:10px 12px}

.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:5;animation:fade .25s ease-out;overflow-y:auto}
@keyframes fade{from{opacity:0}}
.card{width:min(370px,100%);background:var(--panel);border:1px solid var(--edge);border-radius:24px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{font-family:var(--display);font-weight:400;font-size:25px;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:16px}
.btn{position:relative;font-family:var(--display);font-size:18px;border:0;border-radius:16px;padding:13px 16px;cursor:pointer;color:var(--btnfg);background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:0 5px 0 rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.1}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--edge);box-shadow:none;font-size:15px}
.btn.video{background:linear-gradient(180deg,#7fd1ff,#3b82f6);color:#fff;font-size:15px}
.btn svg{width:20px;height:20px;flex:none}
.btn small{font-family:var(--body);font-weight:800;font-size:12px;opacity:.8}
.row{display:flex;gap:10px}.row>*{flex:1}
.pill{align-self:center;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;border:1px solid var(--edge);font-weight:800;font-variant-numeric:tabular-nums}

.logo{font-family:var(--display);line-height:.9;margin:2px 0 4px}
.logo .l1{font-size:62px;background:linear-gradient(180deg,var(--accent2),var(--accent) 70%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4));display:block;animation:flicker 3s infinite}
.logo .l2{font-size:26px;letter-spacing:.18em;display:block}
@keyframes flicker{0%,100%{filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}50%{filter:drop-shadow(0 4px 0 rgba(0,0,0,.4)) drop-shadow(0 0 18px var(--accent))}}
.big{font-family:var(--display);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.record{align-self:center;font-family:var(--display);font-size:14px;padding:6px 12px;border-radius:99px;background:var(--accent2);color:var(--btnfg);animation:pop .4s .2s both cubic-bezier(.2,1.6,.4,1)}
.earn{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:24px;color:var(--accent2)}
.earn svg.coin{width:26px;height:26px}

.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skin{position:relative;border-radius:16px;border:2px solid transparent;padding:0;overflow:hidden;cursor:pointer;background:none;color:inherit;font:inherit;text-align:left}
.skin canvas{display:block;width:100%;height:66px}
.skin span{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;font-weight:800;font-size:15px;background:rgba(0,0,0,.4);color:#fff}
.skin span em{font-style:normal;display:inline-flex;align-items:center;gap:4px;font-size:14px}
.skin.locked canvas{filter:grayscale(.7) brightness(.6)}
.skin .lock{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff}
.skin .lock svg{width:15px;height:15px}
.skin.confirm span{background:var(--accent);color:var(--btnfg)}
.skin[aria-pressed="true"]{border-color:var(--accent2)}
.toggles{display:flex;flex-direction:column;gap:8px}
.tog{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:14px;border:1px solid var(--edge);font-weight:700;font-size:16px;cursor:pointer;background:none;color:var(--fg)}
.tog b{font-family:var(--display);font-weight:400;font-size:13px;color:var(--accent2)}

.gift{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gday{border-radius:14px;border:1px solid var(--edge);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}
.gday b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--fg);display:flex;align-items:center;gap:3px}
.gday svg{width:16px;height:16px}
.gday.done{opacity:.45}
.gday.today{border:2px solid var(--accent2);background:rgba(255,194,51,.12);color:var(--accent2);animation:wob 1.4s infinite}
.gday.d7{grid-column:span 2}

.mlist{display:flex;flex-direction:column;gap:10px;text-align:left}
.mis{border:1px solid var(--edge);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.mis .t{font-weight:800;font-size:15px;line-height:1.2}
.mis .bar{grid-column:1;height:8px;border-radius:9px;background:rgba(127,127,127,.25);overflow:hidden}
.mis .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.mis .n{font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.mis .rw{grid-row:1/span 3;grid-column:2}
.mis .rw .btn{font-size:14px;padding:8px 10px}
.mis .rw .pill{font-size:14px}
.mis.claimed{opacity:.5}

.toolinfo{display:flex;flex-direction:column;align-items:center;gap:6px}
.toolinfo .ti{width:64px;height:64px;border-radius:20px;background:var(--accent2);color:var(--btnfg);display:grid;place-items:center}
.toolinfo .ti svg{width:36px;height:36px}

.helpb{text-align:start;display:flex;flex-direction:column;gap:14px;max-height:min(58vh,520px);overflow-y:auto;padding-inline-end:4px}
.helpb h3{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:17px;color:var(--accent2)}
.helpb p{color:var(--fg);opacity:.9;font-size:15px;line-height:1.45}
.helpb ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.helpb li{display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.3}
.helpb li canvas,.helpb li .hi{width:36px;height:36px;flex:none;border-radius:10px}
.helpb li .hi{display:grid;place-items:center;background:var(--accent2);color:var(--btnfg)}.helpb li .hi svg{width:22px;height:22px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;border:1px solid var(--edge);background:none;color:var(--fg);font-weight:800;font-size:15px;cursor:pointer;text-align:start}
.lang b{font-size:20px;font-weight:400}.lang[aria-pressed="true"]{border:2px solid var(--accent2);background:rgba(255,194,51,.12)}
.btn .gl{width:18px;height:18px}
.musb,.sndl{display:flex;flex-direction:column;gap:8px;text-align:start;max-height:min(58vh,520px);overflow-y:auto;padding-inline-end:4px}
.musb h3{margin:8px 0 0;font-family:var(--display);font-weight:400;font-size:15px;color:var(--accent2);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.musb h3 small{font-family:var(--body);font-weight:700;font-size:12px;color:var(--muted)}
.musb p{font-size:14px}
.vol{display:flex;align-items:center;gap:12px;padding:6px 14px;font-weight:700}.vol input{flex:1;accent-color:var(--accent)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px 6px;border-radius:12px;border:1px solid var(--edge);background:none;color:var(--fg);font-weight:800;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent2);color:var(--btnfg);border-color:transparent}
.trk{display:flex;gap:6px;align-items:stretch}.trk .tname{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--edge);background:none;color:var(--fg);font-weight:800;font-size:15px;cursor:pointer;text-align:start}
.trk .tname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trk .tname i{font-style:normal;width:18px;text-align:center;color:var(--accent2)}
.trk.on .tname{border:2px solid var(--accent2);background:rgba(255,194,51,.12)}
.trk .tdel{min-width:44px;border-radius:14px;border:1px solid var(--edge);background:none;color:var(--fg);font-weight:800;cursor:pointer;padding:0 10px}
.snd{border:1px solid var(--edge);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.snd.on{border:2px solid var(--accent2)}
.sndtop{display:flex;align-items:center;justify-content:space-between;gap:8px}.sndtop b{font-size:16px}
.snd .btn{font-size:14px;padding:9px 12px}.snd .btn.pv{flex:none}
.ach{font-size:13px;font-weight:700;color:var(--muted);display:grid;gap:4px}.ach .bar{height:7px;border-radius:9px;background:rgba(127,127,127,.25);overflow:hidden}.ach .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
#adsim{background:#000;backdrop-filter:none;z-index:9}
#adsim .card{background:#111;border-color:#333;color:#eee}
.adbar{height:6px;border-radius:9px;background:#333;overflow:hidden}.adbar i{display:block;height:100%;width:0;background:#4ade80;transition:width .2s linear}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="hud">
    <button class="icon" id="btnPause" data-ta="pause" aria-label="Pausa"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
    <div class="scorebox">
      <div class="toprow">
        <span class="best"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 12H5z"/></svg><span id="best">0</span></span>
        <span class="coins"><i class="coinslot"></i><span class="coinval">0</span></span>
      </div>
      <div class="score" id="score">0</div>
      <div class="tobest" id="tobest"></div>
    </div>
    <button class="icon" id="btnSkin" data-ta="themes" aria-label="Temas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-2 0-.6-.3-1-.6-1.4-.3-.4-.6-.8-.6-1.4 0-1.1.9-2 2-2H17a4 4 0 0 0 4-4c0-4-4-7.2-9-7.2z"/><circle cx="7.5" cy="11" r="1.3" fill="currentColor"/><circle cx="10" cy="7" r="1.3" fill="currentColor"/><circle cx="15" cy="7" r="1.3" fill="currentColor"/></svg></button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast" hidden></div>
    <div id="stuck" hidden><p data-i="stuck"></p><button class="btn ghost" id="btnGiveUp" data-i="giveUp"></button></div>
  </div>
  <div class="tools">
    <button class="tool" data-t="hammer" data-ta="hammer" aria-label="Martillo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 3.5l7 7-2.2 2.2-2.4-2.4-8.6 8.6a1.8 1.8 0 0 1-2.6 0l-.6-.6a1.8 1.8 0 0 1 0-2.6l8.6-8.6-1.4-1.4z"/></svg><b class="cnt">0</b></button>
    <button class="tool" data-t="shuffle" data-ta="shuffle" aria-label="Cambiar piezas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3c5 0 5 10 10 10h3M17 14l3 3-3 3M4 17h3c1.6 0 2.7-1 3.6-2.4M13.4 9.4C14.3 8 15.4 7 17 7h3M17 4l3 3-3 3"/></svg><b class="cnt">0</b></button>
    <button class="tool" data-t="undo" data-ta="undo" aria-label="Deshacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><b class="cnt">0</b></button>
  </div>
  <div class="banner" id="banner" data-i="banner"></div>

  <div class="overlay" id="ovStart">
    <div class="card">
      <div class="logo"><span class="l1">FURY</span><span class="l2">PUZZLE</span></div>
      <span class="pill"><i class="coinslot"></i><span class="coinval">0</span></span>
      <button class="btn" id="btnPlay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg><span data-i="play"></span></button>
      <div class="row">
        <button class="btn ghost" id="btnStartMis"><span data-i="missions"></span><i class="dot misdot" hidden></i></button>
        <button class="btn ghost" id="btnStartSkin" data-i="themes"></button>
      </div>
      <div class="row">
        <button class="btn ghost" id="btnStartMusic"><svg class="gl" viewBox="0 0 24 24" fill="currentColor"><path d="M9 17.5a3 3 0 1 1-2-2.83V5l12-2v11.5a3 3 0 1 1-2-2.83V6.3l-8 1.33z"/></svg><span data-i="music"></span></button>
        <button class="btn ghost" id="btnStartSnd"><svg class="gl" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-i="sounds"></span></button>
      </div>
      <div class="row">
        <button class="btn ghost" id="btnStartHelp" data-i="howto"></button>
        <button class="btn ghost langbtn" id="btnStartLang"><svg class="gl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span class="langname"></span></button>
      </div>
      <button class="btn ghost" id="btnStartGift" hidden><span data-i="gift"></span><i class="dot"></i></button>
      <button class="btn ghost" id="btnStartExit" data-i="exit" hidden></button>
      <div class="label"><span data-i="best"></span>: <span id="startBest">0</span></div>
    </div>
  </div>

  <div class="overlay" id="ovOver" hidden>
    <div class="card">
      <h2 data-i="noSpace"></h2>
      <div class="label" data-i="points"></div>
      <div class="big" id="overScore">0</div>
      <div class="record" id="overRecord" data-i="newRecord" hidden></div>
      <p><span data-i="best"></span>: <span id="overBest">0</span></p>
      <div class="earn" id="overEarn"></div>
      <button class="btn video" id="btnDouble"><span data-i="doubleCoins"></span><small data-i="video"></small></button>
      <button class="btn" id="btnContinue"><span><span data-i="keepPlaying"></span><br><small data-i="watchVideo"></small></span></button>
      <button class="btn ghost" id="btnAgain" data-i="playAgain"></button>
    </div>
  </div>

  <div class="overlay" id="ovPause" hidden>
    <div class="card">
      <h2 data-i="pause"></h2>
      <button class="btn" id="btnResume" data-i="resume"></button>
      <div class="toggles">
        <button class="tog" id="togSound"><span data-i="sound"></span> <b></b></button>
        <button class="tog" id="togVib"><span data-i="vibration"></span> <b></b></button>
      </div>

function hex(h){h=h.replace('#','');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function mix(h,t,a){const p=hex(h),q=hex(t);return'#'+p.map((v,i)=>Math.round(v+(q[i]-v)*a).toString(16).padStart(2,'0')).join('')}
const L=(h,a)=>mix(h,'#ffffff',a), D=(h,a)=>mix(h,'#000000',a);
const A=(h,a)=>{const[r,g,b]=hex(h);return`rgba(${r},${g},${b},${a})`};
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

function bevel(g,x,y,w,r,b,c,t,l,ri,bo){
  g.save();rr(g,x,y,w,w,r);g.clip();g.fillStyle=c;g.fillRect(x,y,w,w);
  const P=(pts,col)=>{g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath();g.fillStyle=col;g.fill()};
  P([x,y,x+w,y,x+w-b,y+b,x+b,y+b],t);P([x+w,y,x+w,y+w,x+w-b,y+w-b,x+w-b,y+b],ri);
  P([x,y+w,x+w,y+w,x+w-b,y+w-b,x+b,y+w-b],bo);P([x,y,x,y+w,x+b,y+w-b,x+b,y+b],l);
  g.restore();
}
function star(g,cx,cy,s,a){g.save();g.globalAlpha=a;g.fillStyle='#fff';g.beginPath();g.moveTo(cx,cy-s);g.quadraticCurveTo(cx,cy,cx+s,cy);g.quadraticCurveTo(cx,cy,cx,cy+s);g.quadraticCurveTo(cx,cy,cx-s,cy);g.quadraticCurveTo(cx,cy,cx,cy-s);g.fill();g.restore()}

    const b=w*.14,gr=g.createLinearGradient(0,y+b,0,y+w-b);gr.addColorStop(0,L(col,.14));gr.addColorStop(1,D(col,.06));
    g.fillStyle=gr;rr(g,x+b,y+b,w-2*b,w-2*b,s*.05);g.fill();
    g.fillStyle='rgba(255,255,255,.28)';g.beginPath();g.ellipse(x+w*.42,y+w*.3,w*.26,w*.09,-.35,0,7);g.fill();

  for(const[rows,wt]of BASE){let cells=[];rows.forEach((r,i)=>[...r].forEach((ch,j)=>{if(ch==='#')cells.push([i,j])}));
    const vars=[];for(let k=0;k<4;k++){const h=Math.max(...cells.map(c=>c[0]))+1;cells=cells.map(([r,c])=>[c,h-1-r]);

/* Rompe celdas, encadena superpoderes, suma puntos y llena la barra de furia */
function blast(set,n,cr,cc){
  const t=now(),S=SKINS[skin],base=set.size,q=[],done=new Set();let powers=0;
  set.forEach(k=>{if(spec[k/N|0][k%N])q.push(k)});
  const add=(a,b)=>{if(a<0||b<0||a>=N||b>=N||grid[a][b]<0)return;const kk=a*N+b;if(!set.has(kk)){set.add(kk);if(spec[a][b])q.push(kk)}};
  while(q.length){const k=q.shift();if(done.has(k))continue;done.add(k);const i=k/N|0,j=k%N,type=spec[i][j];if(!type)continue;
    powers++;const x=bx+(j+.5)*cell,y=by+(i+.5)*cell,ci=grid[i][j];
    floatText(T_('p_'+type),x,y-cell*.7,'#ffffff',cell*.5);Snd.power(type);vib([20,20,40]);mission('power',1);
    if(type==='bomb'){for(let a=i-1;a<=i+1;a++)for(let b=j-1;b<=j+1;b++)add(a,b);rings.push({x,y,t0:t,col:'#ffb020',r:cell*2.2});shake=Math.max(shake,12)}
    else if(type==='bolt'){for(let m=0;m<N;m++){add(i,m);add(m,j)}beams.push({rc:'r',i,t0:t,ci:3},{rc:'c',i:j,t0:t,ci:3});shake=Math.max(shake,8)}
    else if(type==='rainbow'){for(let a=0;a<N;a++)for(let b=0;b<N;b++)if(grid[a][b]===ci)add(a,b);rings.push({x,y,t0:t,col:S.colors[ci],r:cell*6})}
    else if(type==='x2'){x2T=X2_SECONDS;rings.push({x,y,t0:t,col:'#ffe14d',r:cell*3})}
    else if(type==='ice'){iceSets=Math.max(iceSets,1);tray=tray.map(p=>p.placed?p:Object.assign(makePiece([],true),{ci:p.ci}));trayT0=now();rings.push({x,y,t0:t,col:'#bff4ff',r:cell*3})}
  }
  set.forEach(k=>{const i=k/N|0,j=k%N,d=Math.hypot(i+.5-cr,j+.5-cc);
    clearing.push({r:i,c:j,ci:grid[i][j],sp:spec[i][j],t0:t+d*26});grid[i][j]=-1;spec[i][j]=null});
  let gain=n?10*n*(n+1)/2*Math.max(1,combo):0;gain+=(set.size-base+(n?0:base))*5;gain=Math.round(gain*mult());addScore(gain);
  const px=bx+cc*cell,py=by+cr*cell;
  if(n){const praise=n>=5?T_('pr5'):n===4?T_('pr4'):n===3?T_('pr3'):n===2?T_('pr2'):'';

    mission('lines',n);if(n>=3)mission('multi',1);Snd.clear(n,combo)}
  if(gain)floatText('+'+gain,px,py,'#ffffff',cell*.5);
  if(grid.every(row=>row.every(v=>v<0))){stat('clears',1);addScore(300*mult());floatText(T_('boardClear'),W/2,by+cell*4.6,S.ui.accent2,cell*.55)}
  vib(n>1?[20,30,40]:25);if(!REDUCE)shake=Math.max(shake,Math.min(14,4+n*3+combo));
  if(furyT<=0){meter=Math.min(100,meter+n*11+(combo>1?(combo-1)*9:0)+powers*8);if(meter>=100)startFury()}
}

/* ================= HUD ================= */
let lastShown=-1;
function updateHud(force){if(score>best){best=score;store.set('best',best)}$('#best').textContent=best;$('#startBest').textContent=best;if(force){shown=score;lastShown=-1}
  const tb=$('#tobest');
  if(state!=='play'&&state!=='stuck'){tb.textContent='';tb.className='tobest'}
  else if(recShown){tb.textContent=T_('newRecord').toUpperCase();tb.className='tobest rec'}
  else if(gameBest>0&&score>=gameBest*.6){tb.textContent=T_('toBest',{n:gameBest-score+1});tb.className='tobest'}
  else{tb.textContent='';tb.className='tobest'}}
function tickHud(){shown+=(score-shown)*.18;if(Math.abs(score-shown)<.5)shown=score;const v=Math.round(shown);
  if(v!==lastShown){const el=$('#score');el.textContent=v;if(v>lastShown&&lastShown>=0&&score-v<2){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}lastShown=v}}

/* ================= ENTRADA (ARRASTRAR / MARTILLO) ================= */
function pt(e){const b=cv.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}}
function dragGeom(){const p=tray[drag.i],g=ease((now()-drag.t0)/120),s=tc+(cell-tc)*g,w=p.w*s,h=p.h*s;
  const lift=drag.mouse?h/2:h+cell*.85*g;return{x:drag.x-w/2,y:drag.y-lift,s}}
cv.addEventListener('pointerdown',e=>{const p=pt(e);
  if(hammer&&(state==='play'||state==='stuck')){const c=Math.floor((p.x-bx)/cell),r=Math.floor((p.y-by)/cell);
    if(r>=0&&c>=0&&r<N&&c<N&&grid[r][c]>=0){undoSnap=null;inv.hammer--;hammer=false;saveProg();syncTools();Snd.hammer();
      blast(new Set([r*N+c]),0,r+.5,c+.5);rings.push({x:bx+(c+.5)*cell,y:by+(r+.5)*cell,t0:now(),col:'#ffffff',r:cell*1.2});
      unstick();updateHud();save();checkOver()}
    else{hammer=false;syncTools()}return}
  if(state!=='play'||drag)return;
  for(let i=0;i<3;i++){const q=tray[i];if(!q||q.placed)continue;const c=slotC(i);
    if(Math.abs(p.x-c.x)<slotW/2&&p.y>ty-cell*.4&&p.y<ty+trayH+cell){
      drag={i,x:p.x,y:p.y,t0:now(),mouse:e.pointerType==='mouse'};q.ret=null;try{cv.setPointerCapture(e.pointerId)}catch(_){}Snd.pick();vib(6);updGhost();break}}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e);drag.x=p.x;drag.y=p.y;updGhost()});
function endDrag(){if(!drag)return;const q=tray[drag.i];
  if(ghost&&ghost.ok){place(q,ghost.r,ghost.c)}else{const g=dragGeom();q.ret={x:g.x,y:g.y,s:g.s,t0:now()};if(ghost)Snd.bad()}
  drag=null;ghost=null}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
function updGhost(){const q=tray[drag.i],g=dragGeom();
  const c=Math.round((g.x-bx)/cell),r=Math.round((g.y-by)/cell);
  const inside=g.x+q.w*cell>bx-cell*.5&&g.x<bx+N*cell+cell*.5&&g.y+q.h*cell>by-cell*.5&&g.y<by+N*cell+cell*.5;
  if(!inside){ghost=null;return}
  if(!canPlace(q,r,c)){ghost={ok:false};return}
  const occ=grid.map(row=>row.slice());q.cells.forEach(([dr,dc])=>occ[r+dr][c+dc]=q.ci);
  const lines=new Set();for(let i=0;i<N;i++){if(occ[i].every(v=>v>=0))for(let j=0;j<N;j++)lines.add(i*N+j);if(occ.every(row=>row[i]>=0))for(let j=0;j<N;j++)lines.add(j*N+i)}
  ghost={ok:true,r,c,ci:q.ci,lines}}

/* ================= RENDER ================= */
let last=now(),beatN=0;
function frame(){const t=now(),dt=Math.min(.05,(t-last)/1000);last=t;const S=SKINS[skin];
  // relojes de poderes (solo corren mientras juegas)
  if((state==='play'||state==='stuck')&&!overlayOpen()){
    if(furyT>0){furyT-=dt;beatAcc+=dt;if(beatAcc>=.42){beatAcc=0;Snd.beat(beatN++)}if(furyT<=0){furyT=0;meter=0;toast(T_('t_furyEnd'));save()}}
    if(x2T>0){x2T-=dt;if(x2T<=0)x2T=0}}
  const fury=furyT>0;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  // ambiente
  for(const a of amb){a.y-=a.v*dt*(fury?3:1);a.p+=dt;if(a.y<-10){a.y=H+10;a.x=Math.random()*W}
    const al=.25+.25*Math.sin(a.p*2);
    if(S.ambient==='ember'){ctx.fillStyle=`rgba(255,${120+Math.round(80*Math.sin(a.p))},40,${al})`;ctx.beginPath();ctx.arc(a.x+Math.sin(a.p)*6,a.y,a.s,0,7);ctx.fill()}
    else if(S.ambient==='bubble'){ctx.strokeStyle=`rgba(180,240,255,${al})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(a.x+Math.sin(a.p)*8,a.y,a.s*1.6,0,7);ctx.stroke()}
    else if(S.ambient==='twinkle'){star(ctx,a.x,(a.y+H)%H,a.s*1.5,Math.max(0,Math.sin(a.p*1.5))*.6)}}
  let sx=0,sy=0;if(shake>.2){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;shake*=Math.pow(.02,dt)}else shake=0;
  ctx.save();ctx.translate(sx,sy);
  const bs=cell*N;
  // barra de furia
  if(grid){const x0=bx-pad,w0=bs+pad*2,fill=fury?furyT/FURY_SECONDS:meter/100;
    ctx.font=`${Math.round(cell*.32)}px Bungee, Impact, sans-serif`;ctx.textBaseline='alphabetic';ctx.textAlign='left';
    ctx.fillStyle=fury?(Math.sin(t/90)>0?'#ffe14d':'#ff6a1a'):S.ui.muted;ctx.fillText(fury?T_('c_furyOn',{n:Math.ceil(furyT)}):T_('c_fury'),x0,barY-6);
    if(x2T>0){ctx.textAlign='right';ctx.fillStyle='#ffe14d';ctx.fillText(T_('c_x2',{n:Math.ceil(x2T)}),x0+w0,barY-6)}
    else if(iceSets>0){ctx.textAlign='right';ctx.fillStyle='#bff4ff';ctx.fillText(T_('c_ice'),x0+w0,barY-6)}
    rr(ctx,x0,barY,w0,barH,barH/2);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fill();
    if(fill>0){const gr=ctx.createLinearGradient(x0,0,x0+w0,0);gr.addColorStop(0,'#ffc233');gr.addColorStop(.6,'#ff6a1a');gr.addColorStop(1,'#ff2d55');
      ctx.save();if(fury||fill>.85){ctx.shadowColor='#ff6a1a';ctx.shadowBlur=12+6*Math.sin(t/100)}rr(ctx,x0,barY,Math.max(barH,w0*fill),barH,barH/2);ctx.fillStyle=gr;ctx.fill();ctx.restore()}
  }
  // tablero (en Modo Furia se prende fuego)
  if(fury){const gr=ctx.createRadialGradient(W/2,by+bs/2,bs*.2,W/2,by+bs/2,bs*.95);gr.addColorStop(0,'rgba(255,80,0,0)');gr.addColorStop(1,`rgba(255,80,0,${.28+.12*Math.sin(t/110)})`);ctx.fillStyle=gr;ctx.fillRect(0,by-pad*3,W,bs+pad*6);
    if(!REDUCE&&Math.random()<.6)spawn(bx+Math.random()*bs,by+bs+pad,Math.random()<.5?'#ffc233':'#ff5a14',1,'ember')}
  ctx.save();ctx.shadowColor=fury?'#ff5a14':S.glow;ctx.shadowBlur=fury?cell*(1+.4*Math.sin(t/100)):cell*.7;rr(ctx,bx-pad,by-pad,bs+pad*2,bs+pad*2,cell*.3);ctx.fillStyle=S.board;ctx.fill();ctx.restore();
  ctx.lineWidth=fury?3:2;ctx.strokeStyle=fury?'#ff7a1a':S.boardEdge;rr(ctx,bx-pad,by-pad,bs+pad*2,bs+pad*2,cell*.3);ctx.stroke();
  if(S.ambient==='grid'){ctx.strokeStyle='rgba(120,90,255,.18)';ctx.lineWidth=1;for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(bx+i*cell,by);ctx.lineTo(bx+i*cell,by+bs);ctx.moveTo(bx,by+i*cell);ctx.lineTo(bx+bs,by+i*cell);ctx.stroke()}}
  ctx.fillStyle=S.cell;for(let i=0;i<N;i++)for(let j=0;j<N;j++){rr(ctx,bx+j*cell+cell*.06,by+i*cell+cell*.06,cell*.88,cell*.88,cell*.16);ctx.fill()}
  if(grid){
    const gl=ghost&&ghost.ok?ghost.lines:null;
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){let ci=grid[i][j];if(ci<0)continue;
      if(state==='dying'&&t>dieT0+i*70)ci=-1;else if(gl&&gl.has(i*N+j))ci=ghost.ci;
      let sc=1;for(let k=pops.length-1;k>=0;k--){const p=pops[k];if(p.r===i&&p.c===j){const u=(t-p.t0)/220;if(u<1)sc=1+.18*Math.sin(u*Math.PI);break}}
      const x=bx+j*cell,y=by+i*cell;ctx.drawImage(sprite(ci,cell),x+cell*(1-sc)/2,y+cell*(1-sc)/2,cell*sc,cell*sc);
      if(spec&&spec[i][j]&&ci>=0)drawPower(ctx,spec[i][j],x,y,cell,t);
      if(gl&&gl.has(i*N+j)){ctx.fillStyle=`rgba(255,255,255,${.12+.1*Math.sin(t/90)})`;rr(ctx,x+cell*.05,y+cell*.05,cell*.9,cell*.9,cell*.15);ctx.fill()}
      if(hammer){ctx.strokeStyle=`rgba(255,255,255,${.35+.3*Math.sin(t/120)})`;ctx.lineWidth=2;rr(ctx,x+cell*.08,y+cell*.08,cell*.84,cell*.84,cell*.15);ctx.stroke()}}
    while(pops.length&&t-pops[0].t0>400)pops.shift();
    // fantasma
    if(ghost&&ghost.ok){ctx.globalAlpha=.42;const q=tray[drag.i];q.cells.forEach(([dr,dc],k)=>{const x=bx+(ghost.c+dc)*cell,y=by+(ghost.r+dr)*cell;ctx.drawImage(sprite(q.ci,cell),x,y,cell,cell);if(q.sp&&q.sp.i===k)drawPower(ctx,q.sp.t,x,y,cell,t)});ctx.globalAlpha=1}
    // haces de luz y ondas
    for(let k=beams.length-1;k>=0;k--){const b=beams[k],u=(t-b.t0)/420;if(u>1){beams.splice(k,1);continue}if(u<0)continue;
      const col=S.colors[b.ci]||'#fff';ctx.fillStyle=A(L(col,.6),.55*(1-u));
      if(b.rc==='r')rr(ctx,bx-pad,by+b.i*cell-cell*.15*u,bs+pad*2,cell*(1+.3*u),cell*.2);else rr(ctx,bx+b.i*cell-cell*.15*u,by-pad,cell*(1+.3*u),bs+pad*2,cell*.2);ctx.fill()}
    for(let k=rings.length-1;k>=0;k--){const g=rings[k],u=(t-g.t0)/500;if(u>1){rings.splice(k,1);continue}
      ctx.strokeStyle=g.col;ctx.globalAlpha=1-u;ctx.lineWidth=cell*.25*(1-u)+1;ctx.beginPath();ctx.arc(g.x,g.y,g.r*ease(u),0,7);ctx.stroke();ctx.globalAlpha=1}
    // bloques explotando
    for(let k=clearing.length-1;k>=0;k--){const c=clearing[k],u=(t-c.t0)/360;
      if(u>=1){clearing.splice(k,1);continue}
      const x=bx+c.c*cell,y=by+c.r*cell;
      if(u<0){ctx.drawImage(sprite(c.ci,cell),x,y,cell,cell);if(c.sp)drawPower(ctx,c.sp,x,y,cell,t);continue}
      if(!c.boom){c.boom=1;spawn(x+cell/2,y+cell/2,S.colors[c.ci]||'#fff',REDUCE?2:6)}
      const sc=1-ease(u);ctx.globalAlpha=1-u*.3;ctx.drawImage(sprite(c.ci,cell),x+cell*(1-sc)/2,y+cell*(1-sc)/2,cell*sc,cell*sc);
      ctx.globalAlpha=Math.max(0,1-u*2.2);ctx.fillStyle='#fff';rr(ctx,x+cell*(1-sc)/2,y+cell*(1-sc)/2,cell*sc,cell*sc,cell*.15);ctx.fill();ctx.globalAlpha=1}
    // bandeja
    for(let i=0;i<3;i++){const q=tray[i];if(!q||q.placed||(drag&&drag.i===i))continue;const c=slotC(i);
      const u=ease((t-trayT0-i*70)/320);let s=tc,x=c.x-q.w*tc/2+(1-u)*W*.6,y=c.y-q.h*tc/2;
      if(q.ret){const v=ease((t-q.ret.t0)/180);x=q.ret.x+(x-q.ret.x)*v;y=q.ret.y+(y-q.ret.y)*v;s=q.ret.s+(tc-q.ret.s)*v;if(v>=1)q.ret=null}
      const fits=state==='menu'||canFit(q);ctx.globalAlpha=(fits?1:.35)*Math.max(0,u);
      q.cells.forEach(([dr,dc],k)=>{ctx.drawImage(sprite(q.ci,s),x+dc*s,y+dr*s,s,s);if(q.sp&&q.sp.i===k)drawPower(ctx,q.sp.t,x+dc*s,y+dr*s,s,t)});ctx.globalAlpha=1}
  }
  ctx.restore();
  // pieza arrastrada
  if(drag){const q=tray[drag.i],g=dragGeom();ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=cell*.4;ctx.shadowOffsetY=cell*.15;
    q.cells.forEach(([dr,dc])=>ctx.drawImage(sprite(q.ci,g.s),g.x+dc*g.s,g.y+dr*g.s,g.s,g.s));ctx.restore();
    if(q.sp){const[dr,dc]=q.cells[q.sp.i];drawPower(ctx,q.sp.t,g.x+dc*g.s,g.y+dr*g.s,g.s,t)}}
  // partículas
  for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.life+=dt;if(p.life>p.max){parts.splice(k,1);continue}
    const grav=p.k==='bubble'?-160:p.k==='ember'?-260:p.k==='confetti'?380:600;p.vy+=grav*dt;p.vx*=.98;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
    const al=1-p.life/p.max;ctx.globalAlpha=al;
    if(p.k==='bubble'){ctx.strokeStyle=L(p.col,.5);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.stroke()}
    else if(p.k==='confetti'||p.k==='chip'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.k==='chip'?D(p.col,.15):p.col;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()}
    else if(p.k==='sparkle'){star(ctx,p.x,p.y,p.s*1.6,al)}
    else{ctx.fillStyle=L(p.col,.35);ctx.beginPath();ctx.arc(p.x,p.y,p.s*al+.5,0,7);ctx.fill()}
    ctx.globalAlpha=1}
  // textos flotantes
  for(let k=texts.length-1;k>=0;k--){const f=texts[k],u=(t-f.t0)/1100;if(u>1){texts.splice(k,1);continue}
    const sc=u<.15?.5+u/.15*.6:u<.25?1.1-(u-.15):1;ctx.save();ctx.globalAlpha=u>.7?(1-u)/.3:1;ctx.translate(f.x,f.y-u*cell*1.2);ctx.scale(sc,sc);
    ctx.font=`${Math.round(f.size)}px Bungee, Impact, "Arial Black", sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=f.size*.18;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineJoin='round';ctx.strokeText(f.txt,0,0);ctx.fillStyle=f.col;ctx.fillText(f.txt,0,0);ctx.restore()}
  tickHud();
  if(fury!==lastFury&&!fury)lastFury=false;
  requestAnimationFrame(frame)}

/* ================= TEMAS: APLICAR, COMPRAR Y ELEGIR ================= */
function applySkin(k){skin=k;store.set('skin',k);const S=SKINS[k],app=$('#app');app.style.background=S.bg;
  const u=S.ui;for(const p of['fg','muted','accent','accent2','panel','edge','btnfg'])app.style.setProperty('--'+p,u[p]);
  document.body.style.background=S.board;sprites.clear();buildAmbient()}
let pendingBuy=null;
function buildSkinList(){const list=$('#skinList');list.innerHTML='';
  for(const k in SKINS){const S=SKINS[k],own=owned.includes(k),b=document.createElement('button');
    b.className='skin'+(own?'':' locked')+(pendingBuy===k?' confirm':'');b.dataset.k=k;b.style.background=S.bg;b.setAttribute('aria-pressed',k===skin);
    const c=document.createElement('canvas');c.width=240;c.height=132;const g=c.getContext('2d');const s=56;
    [0,1,2,3].forEach(i=>{const tmp=document.createElement('canvas');tmp.width=tmp.height=s;paintBlock(tmp.getContext('2d'),s,S.colors[i],S.style,i);g.drawImage(tmp,12+i*s,i%2?66:24)});
    const sp=document.createElement('span');
    const nm=T_('skin_'+k);sp.innerHTML=pendingBuy===k?`${T_('buyQ')} <em>${SKIN_PRICE[k]} ${COIN}</em>`:own?nm:`${nm} <em>${SKIN_PRICE[k]} ${COIN}</em>`;
    b.append(c,sp);if(!own){const l=document.createElement('i');l.className='lock';l.innerHTML=LOCK;b.append(l)}
    b.onclick=()=>{Snd.tap();
      if(own){pendingBuy=null;applySkin(k);buildSkinList();return}
      if(coins<SKIN_PRICE[k]){pendingBuy=null;toast(T_('t_needCoins',{n:SKIN_PRICE[k]-coins}));buildSkinList();return}
      if(pendingBuy!==k){pendingBuy=k;buildSkinList();return}
      coins-=SKIN_PRICE[k];owned.push(k);saveProg();syncCoins();pendingBuy=null;applySkin(k);Snd.record();toast(T_('t_unlocked',{name:T_('skin_'+k)}));buildSkinList()};
    list.append(b)}}
$('#btnCoinVideo').onclick=async()=>{$('#ovSkin').hidden=true;if(await Ads.rewarded())addCoins(50);$('#ovSkin').hidden=false;buildSkinList()};

/* ================= REGALO DIARIO ================= */
function giftState(){const g=store.get('gift',{last:null,day:0});const today=dayKey(),yest=dayKey(new Date(Date.now()-864e5));
  const avail=g.last!==today;const day=avail?(g.last===yest?g.day%7+1:1):g.day;return{g,avail,day}}
function giftLabel(r){let s='';if(r.c)s+=`<b>${r.c} ${COIN}</b>`;if(r.t)s+=`<b>${r.n}× ${ICONS[r.t]}</b>`;return s}
function openGift(){const{avail,day}=giftState();if(!avail)return;const el=$('#giftGrid');el.innerHTML='';
  GIFTS.forEach((r,i)=>{const d=document.createElement('div');d.className='gday'+(i+1<day?' done':'')+(i+1===day?' today':'')+(i===6?' d7':'');d.innerHTML=`${T_('day',{n:i+1})}${giftLabel(r)}`;el.append(d)});
  $('#giftText').textContent=day>1?T_('giftStreak',{n:day}):T_('giftText');
  $('#ovGift').hidden=false}
function claimGift(x){const{day}=giftState();const r=GIFTS[day-1];store.set('gift',{last:dayKey(),day});
  if(r.c)coins+=r.c*x;if(r.t)inv[r.t]+=r.n*x;saveProg();syncCoins();syncTools();Snd.record();vib([20,30,60]);
  $('#ovGift').hidden=true;$('#btnStartGift').hidden=true;toast(x>1?T_('t_double'):T_('t_claimed'))}
$('#btnGiftClaim').onclick=()=>claimGift(1);
$('#btnGiftDouble').onclick=async()=>{$('#ovGift').hidden=true;if(await Ads.rewarded())claimGift(2);else $('#ovGift').hidden=false};

/* ================= BOTONES ================= */
let back=null;
function openOv(id,from){back=from;if(from)$(from).hidden=true;$(id).hidden=false}
function closeOv(id){$(id).hidden=true;if(back)$(back).hidden=false;back=null}
function startPlay(){if(state==='play'||state==='stuck'){updateHud();return}if(!load())newGame();else{syncTools();if(state==='play')checkOver()}}
$('#btnPlay').onclick=()=>{Snd.unlock();Snd.tap();$('#ovStart').hidden=true;if(!store.get('seenHelp',false)){helpThenPlay=true;buildHelp();$('#ovHelp').hidden=false;return}startPlay()};
$('#btnStartSkin').onclick=()=>{Snd.unlock();pendingBuy=null;buildSkinList();openOv('#ovSkin','#ovStart')};
$('#btnStartMis').onclick=()=>{Snd.unlock();renderMis();openOv('#ovMis','#ovStart')};
$('#btnStartGift').onclick=()=>{Snd.unlock();openGift()};
$('#btnSkin').onclick=()=>{Snd.unlock();if(overlayOpen())return;pendingBuy=null;buildSkinList();openOv('#ovSkin',null)};
$('#btnSkinDone').onclick=()=>{pendingBuy=null;closeOv('#ovSkin');Snd.tap()};
$('#btnMisDone').onclick=()=>{closeOv('#ovMis');Snd.tap()};
$('#btnPause').onclick=()=>{if(state!=='play'&&state!=='stuck')return;Snd.unlock();$('#ovPause').hidden=false};
$('#btnResume').onclick=()=>{$('#ovPause').hidden=true};
$('#btnRestart').onclick=()=>{$('#ovPause').hidden=true;$('#stuck').hidden=true;newGame()};
$('#btnPauseSkin').onclick=()=>{pendingBuy=null;buildSkinList();openOv('#ovSkin','#ovPause')};
$('#btnPauseMis').onclick=()=>{renderMis();openOv('#ovMis','#ovPause')};
$('#btnContinue').onclick=doContinue;$('#btnAgain').onclick=again;
function syncTog(){$('#togSound b').textContent=settings.snd?T_('yes'):T_('no');$('#togVib b').textContent=settings.vib?T_('yes'):T_('no')}
$('#togSound').onclick=()=>{settings.snd=!settings.snd;store.set('snd',settings.snd);syncTog();Snd.tap()};
$('#togVib').onclick=()=>{settings.vib=!settings.vib;store.set('vib',settings.vib);syncTog();vib(20)};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='play'||state==='stuck'))save()});

function applyLang(){document.documentElement.lang=lang;$('#app').dir=lang==='ur'?'rtl':'ltr';
  $$('[data-i]').forEach(e=>e.textContent=T_(e.dataset.i));$$('[data-ta]').forEach(e=>e.setAttribute('aria-label',T_(e.dataset.ta)));
  const L=LANGS.find(x=>x.c===lang);$$('.langname').forEach(e=>e.textContent=L.n);
  syncTog();updateHud();if(!$('#ovSkin').hidden)buildSkinList();if(!$('#ovMis').hidden)renderMis();if(!$('#ovHelp').hidden)buildHelp();if(!$('#ovMusic').hidden)renderMusic();if(!$('#ovSnd').hidden)renderSnd()}
function buildLangs(){const el=$('#langList');el.innerHTML='';
  for(const L of LANGS){const b=document.createElement('button');b.className='lang';b.setAttribute('aria-pressed',L.c===lang);b.innerHTML=`<b>${L.f}</b><span>${L.n}</span>`;
    b.onclick=()=>{lang=L.c;store.set('lang',lang);Snd.tap();applyLang();buildLangs()};el.append(b)}}
$('#btnStartLang').onclick=()=>{Snd.unlock();buildLangs();openOv('#ovLang','#ovStart')};
$('#btnPauseLang').onclick=()=>{buildLangs();openOv('#ovLang','#ovPause')};
$('#btnLangDone').onclick=()=>{closeOv('#ovLang');Snd.tap()};

/* ================= MANUAL: CÓMO JUGAR ================= */
function powerIcon(type){const s=72,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');
  paintBlock(g,s,SKINS[skin].colors[{bomb:1,bolt:5,rainbow:6,x2:0,ice:6}[type]],SKINS[skin].style,1);drawPower(g,type,0,0,s,0);return c}
function buildHelp(){const el=$('#helpBody');el.innerHTML='';
  const sec=(tk,pk)=>{const d=document.createElement('section');d.innerHTML=`<h3>${T_(tk)}</h3><p>${T_(pk)}</p>`;el.append(d);return d};
  sec('h_goal_t','h_goal');sec('h_combo_t','h_combo');sec('h_fury_t','h_fury');
  const pw=sec('h_pow_t','h_pow'),ul=document.createElement('ul');
  for(const k of['bomb','bolt','rainbow','x2','ice']){const li=document.createElement('li');li.append(powerIcon(k));const sp=document.createElement('span');sp.textContent=T_('h_'+k);li.append(sp);ul.append(li)}pw.append(ul);
  const tl=sec('h_tools_t','h_tools'),ul2=document.createElement('ul');
  for(const k of['hammer','shuffle','undo']){const li=document.createElement('li');li.innerHTML=`<i class="hi">${ICONS[k]}</i><span><b>${T_(k)}:</b> ${T_(k+'D')}</span>`;ul2.append(li)}tl.append(ul2);
  sec('h_coins_t','h_coins');sec('h_music_t','h_music');el.scrollTop=0}
let helpThenPlay=false;
function openHelp(from){buildHelp();openOv('#ovHelp',from)}
$('#btnStartHelp').onclick=()=>{Snd.unlock();openHelp('#ovStart')};
$('#btnPauseHelp').onclick=()=>openHelp('#ovPause');
$('#btnHelpDone').onclick=()=>{store.set('seenHelp',true);if(helpThenPlay){helpThenPlay=false;back=null;$('#ovHelp').hidden=true;startPlay();return}closeOv('#ovHelp');Snd.tap()};

/* ================= SALIR ================= */
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const AppP=NATIVE?((window.Capacitor.Plugins&&window.Capacitor.Plugins.App)||(window.Capacitor.registerPlugin&&window.Capacitor.registerPlugin('App'))):null;
function exitApp(){save();try{AppP&&AppP.exitApp()}catch(e){}}
$('#btnStartExit').hidden=!NATIVE;$('#btnExitApp').hidden=!NATIVE;
$('#btnStartExit').onclick=exitApp;
$('#btnPauseExit').onclick=()=>{openOv('#ovExit','#ovPause')};
$('#btnExitCancel').onclick=()=>{closeOv('#ovExit')};
$('#btnExitApp').onclick=exitApp;
$('#btnExitMenu').onclick=()=>{back=null;$('#ovExit').hidden=true;$('#stuck').hidden=true;hammer=false;syncTools();save();state='menu';updateHud();$('#ovStart').hidden=false};
// Botón "atrás" de Android
if(AppP&&AppP.addListener){try{AppP.addListener('backButton',()=>{
  if(!$('#adsim').hidden)return;
  const open=[...$$('.overlay')].filter(o=>!o.hidden);const top=open[open.length-1];
  if(!top){if(state==='play'||state==='stuck')$('#ovPause').hidden=false;return}
  const close={ovMusic:'#btnMusDone',ovSnd:'#btnSndDone',ovSkin:'#btnSkinDone',ovMis:'#btnMisDone',ovTool:'#btnToolClose',ovHelp:'#btnHelpDone',ovLang:'#btnLangDone',ovExit:'#btnExitCancel'}[top.id];
  if(close){$(close).click();return}
  if(top.id==='ovPause'){top.hidden=true;return}
  if(top.id==='ovGift'){top.hidden=true;return}
  if(top.id==='ovStart'){exitApp();return}
})}catch(e){}}

$('#btnStartMusic').onclick=()=>openMusic('#ovStart');$('#btnPauseMusic').onclick=()=>openMusic('#ovPause');

$('#btnMusDone').onclick=()=>{closeOv('#ovMusic');Snd.tap()};$('#btnSndDone').onclick=()=>{pvT.forEach(clearTimeout);closeOv('#ovSnd');Snd.tap()};

grid=emptyGrid(-1);spec=emptyGrid(null);sets=0;meter=35;furyT=0;x2T=0;iceSets=0;score=0;gameBest=best;

[[7,0,0],[7,1,0],[7,2,1],[7,3,1],[7,5,2],[7,6,2],[7,7,3],[6,0,4],[6,1,4],[6,6,5],[6,7,5],[5,0,6],[5,7,2],[4,7,0]].forEach(([r,c,ci])=>grid[r][c]=ci);
spec[7][3]='bomb';spec[6][6]='bolt';

applySkin(skin);applyLang();loadSongs();document.addEventListener('pointerdown',()=>Snd.unlock(),{once:true});syncCoins();syncTools();syncDots();resize();updateHud(true);requestAnimationFrame(frame);Ads.init();
