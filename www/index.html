<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style><link rel="stylesheet" href="fonts/fonts.css">
<title>Fury Puzzle</title>
<style>
/* Layout: one-screen game — HUD on top, canvas stage (fury bar + board + tray), tool row, ad banner strip.
   Each skin is its own single visual world; JS writes these tokens per skin. */
:root{
  --bg:#120504; --fg:#fff3e6; --muted:rgba(255,236,220,.62); --accent:#ff6a1a; --accent2:#ffc233;
  --panel:rgba(30,10,7,.86); --edge:rgba(255,120,60,.28); --btnfg:#1a0703;
  --display:"Bungee","Impact","Arial Black",system-ui,sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:#0d0403;overscroll-behavior:none}
body{font-family:var(--body);color:var(--fg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);transition:background .4s;isolation:isolate}
#edge{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .45s,box-shadow .45s}
#tint{position:absolute;inset:0;z-index:-1;pointer-events:none;background:transparent;transition:background 1.2s}
button{font-family:var(--body)}
.hud{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;padding:5px 12px 0}
.icon{position:relative;width:44px;height:44px;border-radius:14px;border:1px solid var(--edge);background:var(--panel);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.icon svg{width:22px;height:22px}
.icon:focus-visible,.btn:focus-visible,.skin:focus-visible,.tool:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.scorebox{text-align:center;line-height:1}
.toprow{display:flex;justify-content:center;gap:14px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.best{display:inline-flex;align-items:center;gap:5px;color:var(--accent2)}
.best svg{width:17px;height:17px}
.coins{display:inline-flex;align-items:center;gap:5px;color:var(--fg)}
svg.coin{width:17px;height:17px;flex:none}
.score{font-family:var(--display);font-size:clamp(32px,9vw,46px);margin-top:3px;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.score{position:relative;display:inline-block;isolation:isolate;text-shadow:none;color:transparent;-webkit-text-fill-color:transparent;
  background:linear-gradient(90deg,#ff5fa2,#ffb13d,#ffe14d,#5fe08a,#4fd0ff,#9b7bff,#ff5fa2,#ffb13d) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.35));animation:rainbow 5s linear infinite}
@keyframes rainbow{to{background-position:-150% 0}}
.score.bump{animation:rainbow 5s linear infinite,bump .25s ease-out}
.best.live{animation:bestlive .9s ease-in-out infinite;color:#ffe14d}
@keyframes bestlive{50%{transform:scale(1.14);filter:drop-shadow(0 0 6px #ffc233)}}
.medals{display:flex;justify-content:center;gap:10px;margin:2px 0}
.medal{width:86px;padding:10px 4px 12px;text-align:center;color:#fff;font-weight:800;font-size:10.5px;line-height:1.15;clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%);text-shadow:0 1px 0 rgba(0,0,0,.35)}
.medals .medal{animation:stamp .42s cubic-bezier(.2,1.5,.4,1) both}.medals .medal:nth-child(1){animation-delay:.25s}.medals .medal:nth-child(2){animation-delay:.55s}.medals .medal:nth-child(3){animation-delay:.85s}
@keyframes stamp{from{transform:scale(2.4);opacity:0}}
.flycoin{position:fixed;z-index:9;width:22px;height:22px;pointer-events:none}.flycoin svg{width:100%;height:100%}
.medal b{display:block;font-family:var(--display);font-weight:400;font-size:20px;margin-top:3px;color:#fff}
.medal.m0{background:linear-gradient(180deg,#5cc8ff,#2a6fe0)}.medal.m1{background:linear-gradient(180deg,#b5e84a,#3fa53a)}.medal.m2{background:linear-gradient(180deg,#ff8fc0,#e0407f)}
.rv{display:flex;flex-direction:column;align-items:center;gap:16px;width:min(330px,100%)}
.rv .ring{position:relative;width:104px;height:104px}.rv .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rv .ring circle{fill:rgba(0,0,0,.45);stroke:rgba(255,255,255,.18);stroke-width:7}.rv .ring circle.p{fill:none;stroke:#ffc233;stroke-linecap:round;stroke-dasharray:289;transition:stroke-dashoffset 1s linear}
.rv .ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:46px;color:#fff}
.rv .btn{width:100%}.rv .btn.video{background:linear-gradient(180deg,#7be36a,#2fa53a);font-size:18px;padding:14px}
@keyframes bump{40%{transform:scale(1.12)}}
.tobest{height:16px;font-size:13px;font-weight:700;color:var(--muted);margin-top:2px}
.tobest.rec{color:var(--accent2);font-family:var(--display);font-weight:400}
.tobest.low{color:#ff6b7a;animation:bump .5s ease-in-out infinite}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.tools{display:flex;justify-content:center;gap:14px;padding:6px 16px 4px;flex:none}
.tool{position:relative;width:62px;height:44px;border-radius:16px;border:1px solid var(--edge);background:var(--panel);color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0}
.tool svg{width:24px;height:24px}
.tool .cnt{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--accent2);color:var(--btnfg);font-family:var(--display);font-size:12px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.tool .cnt.zero{background:#5d9cff;color:#fff}
.tool.on{background:var(--accent2);color:var(--btnfg);animation:wob .6s infinite}
@keyframes wob{50%{transform:rotate(-6deg) scale(1.05)}}
.tool:disabled{opacity:.4}
.banner{height:56px;flex:none;display:grid;place-items:center;margin:0 16px 6px;border-radius:10px;border:1px dashed var(--edge);color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.banner.native{border:0;margin:0}
.dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#ff3355;border:2px solid var(--panel)}

#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:4;max-width:calc(100% - 32px);padding:8px 16px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);font-weight:800;font-size:15px;text-align:center;pointer-events:none;transition:opacity .25s,transform .25s}
#toast[hidden]{display:block!important;opacity:0;transform:translate(-50%,10px)}
#stuck{position:absolute;left:8px;right:8px;top:2px;z-index:3;display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:14px;background:var(--panel);border:1px solid var(--accent);animation:pop .3s}
#stuck p{margin:0;flex:1;font-weight:800;font-size:14px;line-height:1.15}
#stuck .btn{font-size:13px;padding:7px 10px;width:auto;min-height:0;gap:4px}#stuck .btn svg{width:16px;height:16px}
.sring{position:relative;width:34px;height:34px;flex:none}.sring svg{width:100%;height:100%;transform:rotate(-90deg)}
.sring circle{fill:rgba(0,0,0,.4);stroke:rgba(255,255,255,.2);stroke-width:4}.sring circle.p{fill:none;stroke:#ffc233;stroke-linecap:round;stroke-dasharray:107;stroke-dashoffset:0}
.sring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:17px;color:#fff}
.tools.pulse .tool{animation:toolpulse .9s ease-in-out infinite}.tools.pulse .tool:nth-child(2){animation-delay:.15s}.tools.pulse .tool:nth-child(3){animation-delay:.3s}
@keyframes toolpulse{50%{transform:scale(1.12);box-shadow:0 0 0 3px rgba(255,194,51,.55)}}

.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:5;animation:fade .25s ease-out;overflow-y:auto}
@keyframes fade{from{opacity:0}}
.card{width:min(370px,100%);background:var(--panel);border:1px solid var(--edge);border-radius:24px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{font-family:var(--display);font-weight:400;font-size:25px;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:16px}
.btn{position:relative;font-family:var(--display);font-size:18px;border:0;border-radius:16px;padding:13px 16px;cursor:pointer;color:var(--btnfg);background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:0 5px 0 rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.1}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--edge);box-shadow:none;font-size:15px}
.btn.video{background:linear-gradient(180deg,#7fd1ff,#3b82f6);color:#fff;font-size:15px}
.btn svg{width:20px;height:20px;flex:none}
.btn small{font-family:var(--body);font-weight:800;font-size:12px;opacity:.8}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn.daily{background:linear-gradient(#a86bff,#6a3df0);color:#fff;box-shadow:0 5px 0 #3a1a8a,0 10px 24px rgba(106,61,240,.35);position:relative}
.btn.daily .gl{width:20px;height:20px}
.dnotif{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted);margin:4px 0 2px;cursor:pointer}
.dnotif input{width:20px;height:20px;accent-color:var(--accent)}
#dGoal{font-size:17px;font-weight:800;color:var(--fg);margin:2px 0 6px}
#dStatus{font-size:14px;margin:6px 0 2px}
.gday.d7 b{font-family:inherit;font-size:12px;font-weight:800;color:var(--accent2)}
.testtag{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:99px;background:#2b7bff;color:#fff;font:800 12px/1.6 var(--body,sans-serif);letter-spacing:.1em}

#tut{position:absolute;inset:0;z-index:3;pointer-events:none}
#tut .tb{position:absolute;left:50%;transform:translateX(-50%);width:min(340px,calc(100% - 24px));background:var(--panel);border:2px solid var(--accent2);border-radius:18px;padding:12px 14px;text-align:center;font-weight:800;font-size:16px;line-height:1.3;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:auto;animation:tutIn .3s ease-out}
#tut .tb .tbb{display:flex;gap:8px;justify-content:center;margin-top:10px}
#tut .tb button{font:inherit;font-size:14px;border-radius:99px;padding:8px 16px;cursor:pointer}
#tut .tb .go{background:linear-gradient(var(--accent2),var(--accent));color:var(--btnfg);border:0}
#tut .tb .sk{background:transparent;color:var(--muted);border:1px solid var(--edge)}
#tut .tb.up::before,#tut .tb.down::after{content:"";position:absolute;left:50%;margin-left:-9px;border:9px solid transparent}
#tut .tb.up::before{top:-20px;border-bottom-color:var(--accent2)}
#tut .tb.down::after{bottom:-20px;border-top-color:var(--accent2)}
#tut .hl{position:absolute;border:3px dashed #fff;border-radius:8px;box-shadow:0 0 18px #ffe14d,inset 0 0 14px rgba(255,225,77,.5);animation:tutPulse 1s ease-in-out infinite alternate}
#tut .hand{position:absolute;left:0;top:0;width:54px;height:54px;margin:-6px 0 0 -14px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
#tut .gp{position:absolute;left:0;top:0;opacity:.7}
#tut .gp i{position:absolute;top:0;border-radius:6px;background:linear-gradient(#ffd36b,#ff8a2a);border:2px solid #fff}
@keyframes tutPulse{from{opacity:.55}to{opacity:1}}
@keyframes tutIn{from{opacity:0;transform:translate(-50%,8px)}}

.fbsec{text-align:center;border-top:1px solid var(--edge);padding-top:12px;margin-top:6px}.fbsec .btn{margin:8px auto 0;width:auto;padding:10px 18px}
.pill{align-self:center;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;border:1px solid var(--edge);font-weight:800;font-variant-numeric:tabular-nums}

.logo{font-family:var(--display);line-height:.9;margin:2px 0 4px}
.logo .l1{font-size:62px;background:linear-gradient(180deg,var(--accent2),var(--accent) 70%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4));display:block;animation:flicker 3s infinite}
.logo .l2{font-size:26px;letter-spacing:.18em;display:block}
@keyframes flicker{0%,100%{filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}50%{filter:drop-shadow(0 4px 0 rgba(0,0,0,.4)) drop-shadow(0 0 18px var(--accent))}}
.big{font-family:var(--display);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.record{align-self:center;font-family:var(--display);font-size:14px;padding:6px 12px;border-radius:99px;background:var(--accent2);color:var(--btnfg);animation:pop .4s .2s both cubic-bezier(.2,1.6,.4,1)}
.earn{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:24px;color:var(--accent2)}
.earn svg.coin{width:26px;height:26px}

.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skin{position:relative;border-radius:16px;border:2px solid transparent;padding:0;overflow:hidden;cursor:pointer;background:none;color:inherit;font:inherit;text-align:left}
.skin canvas{display:block;width:100%;height:66px}
.skin span{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;font-weight:800;font-size:15px;background:rgba(0,0,0,.4);color:#fff}
.skin span em{font-style:normal;display:inline-flex;align-items:center;gap:4px;font-size:14px}
.skin.locked canvas{filter:grayscale(.7) brightness(.6)}
.skin .lock{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff}
.skin .lock svg{width:15px;height:15px}
.skin.confirm span{background:var(--accent);color:var(--btnfg)}
.skin[aria-pressed="true"]{border-color:var(--accent2)}
.toggles{display:flex;flex-direction:column;gap:8px}
.tog{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:14px;border:1px solid var(--edge);font-weight:700;font-size:16px;cursor:pointer;background:none;color:var(--fg)}
.tog b{font-family:var(--display);font-weight:400;font-size:13px;color:var(--accent2)}

.gift{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gday{border-radius:14px;border:1px solid var(--edge);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}
.gday b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--fg);display:flex;align-items:center;gap:3px}
.gday svg{width:16px;height:16px}
.gday.done{opacity:.45}
.gday.today{border:2px solid var(--accent2);background:rgba(255,194,51,.12);color:var(--accent2);animation:wob 1.4s infinite}
.gday.d7{grid-column:span 2}

.mlist{display:flex;flex-direction:column;gap:10px;text-align:left}
.mis{border:1px solid var(--edge);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.mis .t{font-weight:800;font-size:15px;line-height:1.2}
.mis .bar{grid-column:1;height:8px;border-radius:9px;background:rgba(127,127,127,.25);overflow:hidden}
.mis .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.mis .n{font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.mis .rw{grid-row:1/span 3;grid-column:2}
.mis .rw .btn{font-size:14px;padding:8px 10px}
.mis .rw .pill{font-size:14px}
.mis.claimed{opacity:.5}

.toolinfo{display:flex;flex-direction:column;align-items:center;gap:6px}
.toolinfo .ti{width:64px;height:64px;border-radius:20px;background:var(--accent2);color:var(--btnfg);display:grid;place-items:center}
.toolinfo .ti svg{width:36px;height:36px}

.helpb{text-align:start;display:flex;flex-direction:column;gap:14px;max-height:min(58vh,520px);overflow-y:auto;padding-inline-end:4px}
.helpb h3{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:17px;color:var(--accent2)}
.helpb p{color:var(--fg);opacity:.9;font-size:15px;line-height:1.45}
.helpb ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.helpb li{display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.3}
.helpb li canvas,.helpb li .hi{width:36px;height:36px;flex:none;border-radius:10px}
.helpb li .hi{display:grid;place-items:center;background:var(--accent2);color:var(--btnfg)}.helpb li .hi svg{width:22px;height:22px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;border:1px solid var(--edge);background:none;color:var(--fg);font-weight:800;font-size:15px;cursor:pointer;text-align:start}
.lang b{font-size:20px;font-weight:400}.lang[aria-pressed="true"]{border:2px solid var(--accent2);background:rgba(255,194,51,.12)}
.btn .gl{width:18px;height:18px}
.musb,.sndl{display:flex;flex-direction:column;gap:8px;text-align:start;max-height:min(58vh,520px);overflow-y:auto;padding-inline-end:4px}
.musb h3{margin:8px 0 0;font-family:var(--display);font-weight:400;font-size:15px;color:var(--accent2);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.musb h3 small{font-family:var(--body);font-weight:700;font-size:12px;color:var(--muted)}
.musb p{font-size:14px}
.vol{display:flex;align-items:center;gap:12px;padding:6px 14px;font-weight:700}.vol input{flex:1;accent-color:var(--accent)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px 6px;border-radius:12px;border:1px solid var(--edge);background:none;color:var(--fg);font-weight:800;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent2);color:var(--btnfg);border-color:transparent}
.trk{display:flex;gap:6px;align-items:stretch}.trk .tname{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--edge);background:none;color:var(--fg);font-weight:800;font-size:15px;cursor:pointer;text-align:start}
.trk .tname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trk .tname i{font-style:normal;width:18px;text-align:center;color:var(--accent2)}
.trk.on .tname{border:2px solid var(--accent2);background:rgba(255,194,51,.12)}
.trk .tdel{min-width:44px;border-radius:14px;border:1px solid var(--edge);background:none;color:var(--fg);font-weight:800;cursor:pointer;padding:0 10px}
.snd{border:1px solid var(--edge);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.snd.on{border:2px solid var(--accent2)}
.sndtop{display:flex;align-items:center;justify-content:space-between;gap:8px}.sndtop b{font-size:16px}
.snd .btn{font-size:14px;padding:9px 12px}.snd .btn.pv{flex:none}
.ach{font-size:13px;font-weight:700;color:var(--muted);display:grid;gap:4px}.ach .bar{height:7px;border-radius:9px;background:rgba(127,127,127,.25);overflow:hidden}.ach .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
#adsim{background:#000;backdrop-filter:none;z-index:9}
#adsim .card{background:#111;border-color:#333;color:#eee}
.adbar{height:6px;border-radius:9px;background:#333;overflow:hidden}.adbar i{display:block;height:100%;width:0;background:#4ade80;transition:width .2s linear}
/* ===== Navidad ===== */
.btn.xmas{background:linear-gradient(180deg,#ff5468,#c4122f);color:#fff;box-shadow:0 5px 0 #6e0717,0 10px 24px rgba(220,30,60,.35);flex-direction:column;gap:2px;padding-top:15px}
.btn.xmas::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;border-radius:16px 16px 0 0;background:radial-gradient(circle at 7px 0,#fff 6.5px,transparent 7px) 0 0/14px 8px repeat-x}
.btn.xmas .xl{display:flex;align-items:center;gap:8px}
.btn.xmas small{font-family:var(--body);font-weight:800;font-size:12.5px;opacity:.95}
.btn.xmas.soon{filter:saturate(.55) brightness(.9)}
.xhat{display:none}
.xon .logo{position:relative;align-self:center}
.xon .xhat{display:block;position:absolute;left:-17px;top:-19px;width:52px;height:52px;transform:rotate(-24deg);pointer-events:none;z-index:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
.xon #ovStart .card{position:relative}
.xon #ovStart .card::before{content:"";position:absolute;left:18px;right:18px;top:7px;height:9px;pointer-events:none;background:radial-gradient(circle,#ff4d5e 3.6px,transparent 4.2px) 0 0/54px 9px repeat-x,radial-gradient(circle,#3ddc7a 3.6px,transparent 4.2px) 18px 0/54px 9px repeat-x,radial-gradient(circle,#ffd34d 3.6px,transparent 4.2px) 36px 0/54px 9px repeat-x;filter:drop-shadow(0 0 4px rgba(255,220,120,.8));animation:xtw 1.6s ease-in-out infinite alternate}
@keyframes xtw{from{opacity:.55}to{opacity:1}}
.xon #ovStart::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(circle,#fff 1.6px,transparent 2.2px),radial-gradient(circle,#fff 2.4px,transparent 3.2px),radial-gradient(circle,#fff 1.2px,transparent 1.8px);background-size:90px 90px,150px 150px,60px 60px;background-position:0 0,40px 60px,20px 30px;animation:xsnow 10s linear infinite}
@keyframes xsnow{to{background-position:30px 450px,10px 510px,50px 330px}}
.flakes{display:inline-flex;align-items:center;gap:4px;color:#bfe9ff}
.flakes.bump{animation:bump .25s ease-out}
.xsim{display:flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:800;color:#fff;background:#2b7bff;border-radius:12px;padding:5px 6px;flex-wrap:wrap}
.xsim button{border:0;border-radius:8px;background:rgba(255,255,255,.22);color:#fff;font:800 13px var(--body);padding:4px 9px;cursor:pointer}
.xsim b{min-width:9em}
.xtabs{display:flex;gap:6px}.xtabs button{position:relative;flex:1;padding:9px 6px;border-radius:12px;border:1px solid var(--edge);background:none;color:var(--fg);font-weight:800;font-size:15px;cursor:pointer}
.xtabs button[aria-pressed="true"]{background:var(--accent2);color:var(--btnfg);border-color:transparent}
#xCount{font-weight:800;color:var(--fg);font-size:15px}
.xcal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.xw{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid var(--edge);background:linear-gradient(160deg,rgba(255,80,100,.28),rgba(30,160,90,.22));color:var(--fg);font-family:var(--display);font-size:16px;display:grid;place-items:center;cursor:pointer;padding:0;overflow:hidden}
.xw.sp{grid-column:span 2;aspect-ratio:auto;height:48px;font-size:13px}
.xw i{position:absolute;bottom:2px;left:0;right:0;font-style:normal;font-size:10px;font-family:var(--body);font-weight:800;opacity:.85}
.xw.lock{background:rgba(255,255,255,.06);color:var(--muted)}
.xw.lock::after{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:radial-gradient(circle at 5px 0,rgba(255,255,255,.75) 4.5px,transparent 5px) 0 0/10px 7px repeat-x}
.xw.open{background:rgba(255,255,255,.04);color:var(--muted)}
.xw.open::before{content:"✓";position:absolute;top:1px;right:4px;font-size:11px;color:#6ee7a0}
.xw.miss{border:1px dashed var(--accent)}
.xw.today{border:2px solid var(--accent2);box-shadow:0 0 14px rgba(255,211,77,.55);animation:wob 1.4s infinite}
.xw.sel{outline:3px solid #fff;outline-offset:1px}
.xw.pop{animation:xpop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes xpop{0%{transform:scale(1) rotateY(0)}40%{transform:scale(1.35) rotateY(180deg)}100%{transform:scale(1) rotateY(360deg)}}
.xdet{border:1px solid var(--edge);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:center}
.xdet h3{margin:0;font-family:var(--display);font-weight:400;font-size:17px;color:var(--accent2)}
.xdet .xr{font-family:var(--display);font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.xdet .xr b{font-weight:400;display:inline-flex;align-items:center;gap:4px}
.xdet .xr svg{width:20px;height:20px}
.xdet p{font-size:14px}
.xdet .btn{font-size:15px;padding:11px 12px}
#xTreeCv{width:min(280px,100%);height:auto;align-self:center;aspect-ratio:1}
.xbar{height:10px;border-radius:9px;background:rgba(127,127,127,.25);overflow:hidden}.xbar i{display:block;height:100%;background:linear-gradient(90deg,#bfe9ff,#3db8ff)}
.ystats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ystats div{border:1px solid var(--edge);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;gap:2px}
.ystats b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--accent2);font-variant-numeric:tabular-nums}
.ystats span{font-size:12px;font-weight:800;color:var(--muted)}
.skin .free{position:absolute;top:6px;left:6px;padding:2px 8px;border-radius:99px;background:#e8283c;color:#fff;font-size:11px;font-weight:800}
#xIntroCv{width:100%;max-width:300px;height:auto;align-self:center;aspect-ratio:300/110}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

(()=>{
'use strict';
/* ================= IDIOMAS ================= */
const LANGS=[
 {c:"en",n:"English",f:"🇺🇸"},{c:"id",n:"Bahasa Indonesia",f:"🇮🇩"},{c:"vi",n:"Tiếng Việt",f:"🇻🇳"},{c:"pt",n:"Português (Brasil)",f:"🇧🇷"},

function mix(h,t,a){const p=hex(h),q=hex(t);return'#'+p.map((v,i)=>Math.round(v+(q[i]-v)*a).toString(16).padStart(2,'0')).join('')}
const L=(h,a)=>mix(h,'#ffffff',a), D=(h,a)=>mix(h,'#000000',a);

function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

   resumen del año, fuegos artificiales de Año Nuevo y fecha simulada para la app de PRUEBA.
   Todo se guarda aparte por año ('x2026', 'xgame', 'xmeta'); el año siguiente empieza de cero. */
let XD=null,xFlash=0,xSel=null,xTab='cal',xLastKey='';const rockets=[];
function xData(){const k='x'+xYearOf();if(!XD||XD.k!==k)XD=Object.assign({open:{},dbl:{},board:{},flakes:0,orn:0,ornN:0,intro:false,ny:false,xd:false},store.get(k,{}),{k});return XD}
function xSave(){if(XD)store.set(XD.k,XD)}
const XW=[...Array(24)].map((_,i)=>({id:String(i+1),day:i+1})).concat([{id:'25',day:25,sp:'xDay25'},{id:'31',day:31,sp:'xDay31'},{id:'R',day:37,sp:'xDayR'}]);

// tableros navideños (8x8): r=rojo g=verde y=dorado w=blanco b=azul p=violeta o=naranja
const XSHAPES=[
  ['...yy...','...gg...','..gggg..','..grgg..','.gggggb.','...oo...'],          // árbol
  ['...yy...','.yyyyyy.','..yyyy..','..y..y..'],                                  // estrella
  ['..rrrr..','...rr...','...ww...','..wbbw..','..wwww..','...ww...'],          // muñeco de nieve

  ['..rwr...','.w...w..','.....r..','.....w..','.....r..','.....w..'],          // bastón de caramelo
  ['..r..r..','...rr...','.ggrrgg.','.ggrrgg.','.ggrrgg.'],                     // regalo
  ['...yy...','..bbbb..','.bwbbbb.','.bbbbbb.','..bbbb..'],                     // bola de árbol
  ['..www...','..rrr...','..rrr...','..rrrr...','..rrrrr.','...rrr..'],         // bota

function xBoardSpec(day){const sp=day>24,idx=day===25?0:day===31?1:day===37?9:(day-1)%9,flip=!sp&&Math.floor((day-1)/9)%2===1;
  const sh=XSHAPES[idx],off=Math.floor((N-sh.length)/2),cells=[],map={r:0,g:1,y:2,w:3,b:4,p:5,o:6};
  // dos tipos de tablero: 'ice' = descongelar toda la figura · 'lines' = romper líneas; los dos con piezas contadas.
  // Desde el día 13 parte del hielo es grueso (2 golpes). XLIM sale de simular cientos de partidas con un bot.
  const type=sp||day%3!==2?'ice':'lines',dbl=sp?2:day>=19?3:day>=13?4:0;
  sh.forEach((row,r)=>[...row].slice(0,N).forEach((ch,c)=>{if(map[ch]!=null){const cc=flip?N-1-c:c;cells.push([r+off,cc,map[ch],type==='ice'?(dbl&&(r+cc)%dbl===0?2:1):0])}}));
  return{d:'x'+xYearOf()+'-'+day+'b',type,goal:type==='ice'?cells.reduce((a,x)=>a+x[3],0):6+Math.floor(day/3),lim:XLIM[day],dbl:!!dbl,cells,xmas:day,rw:{c:sp?150:60+day*3,f:sp?60:30}}}
const XLIM={1:19,2:16,3:19,4:18,5:21,6:19,7:19,8:19,9:17,10:17,11:23,12:16,13:33,14:27,15:34,16:34,17:25,18:29,19:31,20:29,21:31,22:34,23:34,24:31,25:38,31:31,37:41};
const xBoardTxt=sp=>T_(sp.type==='ice'?'xBoardI':'xBoardL',{n:sp.goal,p:sp.lim})+(sp.dbl?' '+T_('xIce2'):'');
function xRwHtml(r){const a=[];if(r.c)a.push(`<b>${r.c} ${COIN}</b>`);if(r.f)a.push(`<b>${r.f} ❄</b>`);if(r.tl)for(const k in r.tl)a.push(`<b>${r.tl[k]}× ${ICONS[k]}</b>`);
  if(r.pack)a.push(`<b>🎵 ${sndOwned.includes(r.pack)?'+500 '+COIN:T_('snd_'+r.pack)}</b>`);if(r.skin)a.push(`<b>${T_('xStar')}</b>`);return a.join(' ')}
function xGrant(r,x=1){if(r.c)coins+=r.c*x;if(r.tl)for(const k in r.tl)inv[k]+=r.tl[k]*x;
  if(r.pack){if(sndOwned.includes(r.pack))coins+=500;else{sndOwned.push(r.pack);store.set('sndOwned',sndOwned)}}
  if(r.skin&&!owned.includes(r.skin))owned.push(r.skin);
  saveProg();syncCoins();syncTools();if(r.f)xFlakes(r.f*x,true)}
function xFlakes(n,force){if(!(xOn()||force)||n<=0)return;const d=xData();d.flakes+=n;
  const ready=XORN.filter(o=>d.flakes>=o[0]).length;if(ready>d.ornN){d.ornN=ready;if(ready>d.orn&&state==='play')toast(T_('t_xOrn'))}

function xClaimable(){if(!xOn())return{cal:0,tree:0};const d=xData(),w=xTodayW();return{cal:w&&!d.open[w.id]?1:0,tree:XORN.filter(o=>d.flakes>=o[0]).length-d.orn}}
function syncXDot(){const c=xClaimable();$$('.xdot').forEach(e=>e.hidden=!(c.cal||c.tree));$$('.xcaldot').forEach(e=>e.hidden=!c.cal);$$('.xtreedot').forEach(e=>e.hidden=!c.tree)}

function xCountText(){const n=xNow(),ph=xPhase(n);
  if(ph==='soon'){const left=Math.round((new Date(n.getFullYear(),11,1)-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5);return left<=1?T_('xSoon1'):T_('xSoon',{n:left})}

    if(XNY())return T_('xToXmas',{n:32-dd});
    if(dd<24)return T_('xToXmas',{n:25-dd});if(dd===24)return T_('xToXmas1');if(dd===25)return T_('xMerry');return T_('xToNY',{n:32-dd,y:ny})}
  if(dd===6)return T_('xLast');const e=T_('xEnds',{n:7-dd});return dd===1?T_('xHappyNY',{y:n.getFullYear()})+' · '+e:e}

const ORN_POS=[[.5,.76],[.33,.73],[.67,.71],[.42,.6],[.6,.55],[.38,.47],[.57,.41],[.46,.33],[.53,.24]];
const ORN_COL=['#e8283c','#ffd34d','#3db8ff','#a45cff','#ff8a2a','#eef3ff','#ff5fa2','#4ade80','#ffc53d'];
function starPath(g,cx,cy,R,r){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r:R;g.lineTo(cx+Math.cos(a)*q,cy+Math.sin(a)*q)}g.closePath()}
function drawXTree(g,S,n){g.clearRect(0,0,S,S);
  const bg=g.createRadialGradient(S/2,S*.4,S*.05,S/2,S*.5,S*.62);bg.addColorStop(0,'rgba(90,150,240,.4)');bg.addColorStop(1,'rgba(10,22,48,0)');g.fillStyle=bg;g.fillRect(0,0,S,S);
  for(let i=0;i<34;i++){const x=(Math.sin(i*12.9898)*43758.5453%1+1)%1*S,y=(Math.sin(i*78.233)*12345.678%1+1)%1*S*.85;g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.arc(x,y,S*.004+i%3*S*.002,0,7);g.fill()}
  g.fillStyle='#eef3ff';g.beginPath();g.ellipse(S/2,S*.92,S*.42,S*.055,0,0,7);g.fill();
  g.fillStyle='#6b3f22';g.fillRect(S*.45,S*.8,S*.1,S*.11);
  [[.4,.84,.38],[.24,.63,.29],[.11,.43,.19]].forEach(([a,b,h])=>{const gr=g.createLinearGradient(0,S*a,0,S*b);gr.addColorStop(0,'#2fbf6a');gr.addColorStop(1,'#0f6b35');g.fillStyle=gr;
    g.beginPath();g.moveTo(S/2,S*a);g.lineTo(S/2+S*h,S*b);g.quadraticCurveTo(S/2,S*(b+.05),S/2-S*h,S*b);g.closePath();g.fill();
    g.fillStyle='rgba(245,250,255,.92)';for(let k=-4;k<=4;k++){const u=k/4.4;g.beginPath();g.arc(S/2+u*S*h,S*(b+.024*(1-u*u))-S*.004,S*.022,0,7);g.fill()}});
