name: Construir APK

on:
  push:
    branches: [main, navidad, anuncios-v16, analytics]   # otras ramas = versiones de prueba (no tocan el release de Play)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar juego
        run: |
          sh build-www.sh
          npx cap sync android

      - name: Número de versión automático
        run: sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      # Firebase Analytics: solo si existe el secreto GOOGLE_SERVICES_JSON (el contenido de google-services.json).
      # Sin el secreto la app se construye igual, sin medición.
      - name: Firebase Analytics (opcional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "Sin secreto GOOGLE_SERVICES_JSON: se construye sin Analytics"; exit 0; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/google-services.json"
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$RUNNER_TEMP/google-services.json" || { echo "::error::GOOGLE_SERVICES_JSON no es un JSON válido"; exit 1; }
          grep -q '"com.furypuzzle.game"' "$RUNNER_TEMP/google-services.json" || { echo "::error::El google-services.json no es de com.furypuzzle.game"; exit 1; }
          # La app de PRUEBA (com.furypuzzle.game.test) solo lleva Analytics si también está registrada en Firebase
          if grep -q '"com.furypuzzle.game.test"' "$RUNNER_TEMP/google-services.json"; then cp "$RUNNER_TEMP/google-services.json" android/app/google-services.json; echo "Analytics también en la app de PRUEBA"; fi

      - name: Construir APK (para instalar en el celular)
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Nombre del archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FuryPuzzle-PRUEBA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FuryPuzzle-APK
          path: FuryPuzzle-PRUEBA.apk

      - name: Construir AAB firmado (para Google Play)
        if: env.HAS_KEY == 'true' && github.ref_name == 'main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          if [ -f "$RUNNER_TEMP/google-services.json" ]; then cp "$RUNNER_TEMP/google-services.json" android/app/google-services.json; fi
          cd android && ./gradlew bundleRelease --no-daemon
          jarsigner -keystore ../upload.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/bundle/release/app-release.aab ../FuryPuzzle.aab

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true' && github.ref_name == 'main'
        with:
          name: FuryPuzzle-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Publicar APK para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && format('v{0}', github.run_number) || format('{0}-{1}', github.ref_name, github.run_number) }}
          name: ${{ github.ref_name == 'main' && format('Fury Puzzle (versión {0})', github.run_number) || format('Fury Puzzle PRUEBA {0} ({1})', github.ref_name, github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: |
            FuryPuzzle-PRUEBA.apk
            FuryPuzzle.aab
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}

