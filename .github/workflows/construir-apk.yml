name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar juego
        run: |
          sh build-www.sh
          npx cap sync android

      - name: Número de versión automático
        run: sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Construir APK (para instalar en el celular)
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Nombre del archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FuryPuzzle.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FuryPuzzle-APK
          path: FuryPuzzle.apk

      - name: Construir AAB firmado (para Google Play)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          cd android && ./gradlew bundleRelease --no-daemon
          jarsigner -keystore ../upload.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/bundle/release/app-release.aab ../FuryPuzzle.aab

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: FuryPuzzle-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Publicar APK para descargar desde el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Fury Puzzle (versión ${{ github.run_number }})
          files: |
            FuryPuzzle.apk
            FuryPuzzle.aab
          make_latest: true

